[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12.0 (older pinned 18 caused builds to fail)
  NODE_VERSION = "22"
  # Site is Astro, not Next.js — skip the auto-installed @netlify/plugin-nextjs
  # (a stale "Next.js" Runtime in the Netlify UI caused failed deploys).
  # Permanent fix: Project configuration → Build & deploy → Build settings →
  # clear the "Runtime" field (currently set to Next.js).
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Hashed static assets (Astro emits into /_astro/ with content hashes) can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pagefind search index assets are content hashed on build too.
[[headers]]
  for = "/_pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 301 (2026-09-10): the stale single-month August 2026 deadline page was retired.
# Its ranking equity passes to the evergreen deadline calendar.
[[redirects]]
  from = "/resources/kra-vat-filing-deadline-august-2026"
  to = "/tax-deadlines/"
  status = 301
  force = true

[[redirects]]
  from = "/resources/kra-vat-filing-deadline-august-2026/"
  to = "/tax-deadlines/"
  status = 301
  force = true

